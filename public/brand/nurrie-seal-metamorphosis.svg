<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" fill="none">
  <!-- NURRIE Circular Metamorphosis Seal (Luxury Packaging Deboss) -->
  <defs>
    <linearGradient id="sealGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED6C7" />
      <stop offset="50%" stop-color="#D6B19A" />
      <stop offset="100%" stop-color="#B28770" />
    </linearGradient>
    <path id="sealTopArc" d="M 28 100 A 72 72 0 0 1 172 100" />
    <path id="sealBottomArc" d="M 172 100 A 72 72 0 0 1 28 100" />
  </defs>

  <!-- Outer Concentric Rings -->
  <circle cx="100" cy="100" r="95" stroke="#D6B19A" stroke-width="1.2" stroke-opacity="0.7" />
  <circle cx="100" cy="100" r="88" stroke="#3C2820" stroke-width="0.75" stroke-dasharray="2 3" />
  <circle cx="100" cy="100" r="62" stroke="#D6B19A" stroke-width="0.8" />

  <!-- Circular Curved Typography -->
  <text font-family="'General Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="0.22em" fill="#3C2820">
    <textPath href="#sealTopArc" startOffset="50%" text-anchor="middle">
      NURRIE · BEAUTÉ INAUGURALE
    </textPath>
  </text>
  <text font-family="'General Sans', sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.24em" fill="#776257">
    <textPath href="#sealBottomArc" startOffset="50%" text-anchor="middle">
      PARIS · NEW YORK · TOKYO
    </textPath>
  </text>

  <!-- Central Monogram -->
  <g transform="translate(67, 67) scale(0.55)">
    <!-- Left Pillar -->
    <rect x="25" y="24" width="7" height="72" rx="1" fill="#3C2820" />
    <rect x="21" y="22" width="15" height="3.5" fill="#3C2820" />
    <rect x="21" y="94.5" width="15" height="3.5" fill="#3C2820" />

    <!-- Right Pillar -->
    <rect x="88" y="24" width="7" height="72" rx="1" fill="#3C2820" />
    <rect x="84" y="22" width="15" height="3.5" fill="#3C2820" />
    <rect x="84" y="94.5" width="15" height="3.5" fill="#3C2820" />

    <!-- Diagonal Metamorphosis Stroke -->
    <path d="M31 24.5 L89 95.5 H96 L38 24.5 Z" fill="url(#sealGold)" />

    <!-- Axis Node -->
    <polygon points="60,49 70,60 60,71 50,60" fill="url(#sealGold)" />
    <polygon points="60,53 66,60 60,67 54,60" fill="#FCFAF7" />
    <circle cx="60" cy="60" r="1.5" fill="#3C2820" />
  </g>
</svg>
