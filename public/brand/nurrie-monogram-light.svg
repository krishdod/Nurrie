<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- NURRIE Flagship Dual-Axis Monogram (Light on Dark) -->
  <defs>
    <linearGradient id="nurrieRoseGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFD4" />
      <stop offset="45%" stop-color="#E5C4AF" />
      <stop offset="100%" stop-color="#CFA48D" />
    </linearGradient>
    <linearGradient id="nurrieIvory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3EFE9" />
    </linearGradient>
  </defs>

  <!-- Left Pillar (Formula Origin) -->
  <rect x="25" y="24" width="7" height="72" rx="1" fill="url(#nurrieIvory)" />
  <rect x="21" y="22" width="15" height="3.5" rx="0.5" fill="url(#nurrieIvory)" />
  <rect x="21" y="94.5" width="15" height="3.5" rx="0.5" fill="url(#nurrieIvory)" />

  <!-- Right Pillar (Brush Buffer) -->
  <rect x="88" y="24" width="7" height="72" rx="1" fill="url(#nurrieIvory)" />
  <rect x="84" y="22" width="15" height="3.5" rx="0.5" fill="url(#nurrieIvory)" />
  <rect x="84" y="94.5" width="15" height="3.5" rx="0.5" fill="url(#nurrieIvory)" />

  <!-- The Metamorphic Diagonal Axis -->
  <path d="M31 24.5 L89 95.5 H96 L38 24.5 Z" fill="url(#nurrieRoseGoldLight)" />

  <!-- Rose Gold Axis Node (Central Magnetic Collar) -->
  <polygon points="60,49 70,60 60,71 50,60" fill="url(#nurrieRoseGoldLight)" />
  <polygon points="60,53 66,60 60,67 54,60" fill="#241712" />
  <circle cx="60" cy="60" r="1.5" fill="url(#nurrieRoseGoldLight)" />
</svg>
